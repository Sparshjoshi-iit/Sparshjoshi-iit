name: Update Contribution Stats

on:
  schedule:
    - cron: "0 0 * * *"   # Every day at midnight UTC
  workflow_dispatch:        # Manual trigger from Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run stats generator
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 .github/scripts/generate_stats.py

      - name: Update last-year badge in README
        run: |
          source .contribution_counts
          echo "Last year count: $LAST_YEAR"
          sed -i "s|Contributions%20Last%20Year-[0-9]*-00c853|Contributions%20Last%20Year-${LAST_YEAR}-00c853|g" README.md

      - name: Commit and push changes
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md streak-card.svg
          git diff --staged --quiet || (
            git commit -m "chore: update contribution stats [skip ci]" &&
            git push
          )
